name = "pickglass"
version = "0.1.0"
licences = ["Apache-2.0"]
description = "A BEAM runtime inspector and performance and trace viewer, written in Gleam."
target = "erlang"

gleam = ">= 1.18.0"

repository = { type = "github", user = "Roasbeef", repo = "pickglass" }

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
weft = ">= 0.4.5 and < 1.0.0"
simplifile = ">= 2.0.0 and < 3.0.0"
argv = ">= 1.0.0 and < 2.0.0"
pickglass_core = { path = "../core" }

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
qcheck = ">= 1.0.5 and < 2.0.0"
